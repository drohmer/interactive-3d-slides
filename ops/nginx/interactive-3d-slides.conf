# The tutorial "Create slides with interactive 3D" on scholartools.fr.
#
# To insert in the HTTPS block `server_name scholartools.fr` of
# /etc/nginx/sites-available/scholartools.fr, before `location / {`, as the blocks of /lhtml/.
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Why a block of its own:
# - a missing file gives a 404 of the tutorial, not the home page of scholartools.fr
#   (`location /` answers /index.html to anything);
# - `^~` stops the regex location of the server for .js/.css (30 days, immutable): the files of the
#   demos keep their names from one version to the next (project.js, slide-controls.js), so they must
#   be revalidated, not cached as immutable.
# .wasm is served as application/wasm by the mime.types of nginx; .data as application/octet-stream.

location = /interactive-3d-slides { return 301 /interactive-3d-slides/; }

# Old addresses (exact matches: the ^~ blocks below stop regex locations)
# "On the day of the talk" moved from 09_talk-day to 10_talk-day (2026-11-06)
location = /interactive-3d-slides/01_tutorial/09_talk-day/ { return 301 /interactive-3d-slides/01_tutorial/10_talk-day/index.html; }
location = /interactive-3d-slides/01_tutorial/09_talk-day/index.html { return 301 /interactive-3d-slides/01_tutorial/10_talk-day/index.html; }
location = /interactive-3d-slides/fr/01_tutorial/09_talk-day/ { return 301 /interactive-3d-slides/fr/01_tutorial/10_talk-day/index.html; }
location = /interactive-3d-slides/fr/01_tutorial/09_talk-day/index.html { return 301 /interactive-3d-slides/fr/01_tutorial/10_talk-day/index.html; }

# The sections "Advanced examples" and "Resources" swapped their folders (2026-11-07):
# 03_examples became 02_examples, and 02_more became 03_more (longest prefix: before the blocks below)
location ^~ /interactive-3d-slides/02_more/ { rewrite ^/interactive-3d-slides/02_more/(.*)$ /interactive-3d-slides/03_more/$1 permanent; }
location ^~ /interactive-3d-slides/03_examples/ { rewrite ^/interactive-3d-slides/03_examples/(.*)$ /interactive-3d-slides/02_examples/$1 permanent; }
location ^~ /interactive-3d-slides/fr/02_more/ { rewrite ^/interactive-3d-slides/fr/02_more/(.*)$ /interactive-3d-slides/fr/03_more/$1 permanent; }
location ^~ /interactive-3d-slides/fr/03_examples/ { rewrite ^/interactive-3d-slides/fr/03_examples/(.*)$ /interactive-3d-slides/fr/02_examples/$1 permanent; }

location ^~ /interactive-3d-slides/fr/ {
    try_files $uri $uri/ =404;
    error_page 404 /interactive-3d-slides/fr/404.html;
    add_header Cache-Control "no-cache";
}

location ^~ /interactive-3d-slides/ {
    try_files $uri $uri/ =404;
    error_page 404 /interactive-3d-slides/404.html;
    add_header Cache-Control "no-cache";
}
